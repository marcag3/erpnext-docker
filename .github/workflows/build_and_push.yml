name: Build and Push Custom ERPNext Image

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly build on Monday at midnight
  workflow_dispatch:
  push:
    branches:
      - v15
      - v16

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Weekly and manual runs move the pinned restic and s6-overlay to their latest
    # release before building; the result is committed below once the build passed
    - name: Bump pinned downloads
      if: github.event_name != 'push'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: .github/scripts/bump-pins.sh

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-

    - name: Generate APPS_JSON_BASE64
      id: apps_json
      run: echo "apps_json_base64=$(base64 -w 0 < apps.json)" >> "$GITHUB_OUTPUT"

    # bench init clones frappe and every app from a branch; without this the layer is
    # served from cache forever because none of its inputs (apps.json, branch name) change
    - name: Resolve app revisions
      id: revs
      run: |
        FRAPPE_BRANCH=$(sed -n 's/^ARG FRAPPE_BRANCH=//p' src/variations/erpnext-nginx/Dockerfile | head -1)
        {
          git ls-remote https://github.com/frappe/frappe "refs/heads/${FRAPPE_BRANCH}"
          jq -r '.[] | "\(.url) refs/heads/\(.branch)"' apps.json | while read -r url ref; do
            git ls-remote "$url" "$ref"
          done
        } | tee /dev/stderr | sha256sum | cut -d' ' -f1 | sed 's/^/apps_rev=/' >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: src/variations/erpnext-nginx/Dockerfile
        push: true
        pull: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          APPS_JSON_BASE64=${{ steps.apps_json.outputs.apps_json_base64 }}
          APPS_REV=${{ steps.revs.outputs.apps_rev }}
          APT_REV=${{ github.run_id }}-${{ github.run_attempt }}
        cache-from: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-buildcache
          type=gha,scope=${{ github.ref_name }}
        cache-to: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-buildcache,mode=max,compression=zstd
          type=gha,mode=max,scope=${{ github.ref_name }}

    # Only reached when the build above succeeded, so a bump that breaks the image is
    # never committed and the previous pins stay. A push made with GITHUB_TOKEN does not
    # trigger another run.
    - name: Commit bumped pins
      if: github.event_name != 'push'
      run: |
        if git diff --quiet; then
          echo "pins already up to date"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -am "⬆️ build: bump pinned restic and s6-overlay"
        git pull --rebase
        git push
